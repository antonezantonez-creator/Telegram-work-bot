[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-aiogram-bot"
version = "0.1.0"
description = "A Telegram bot starter built with aiogram 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "aiogram>=3.13,<4",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["telegram_bot*"]
